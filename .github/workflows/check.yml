name: bol-bestellingen checken
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    paths: [".github/**", "check_orders.py", "backfill.txt"]
permissions:
  contents: write
concurrency: check
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 check_orders.py
        env:
          BOL_CLIENT_ID: ${{ secrets.BOL_CLIENT_ID }}
          BOL_CLIENT_SECRET: ${{ secrets.BOL_CLIENT_SECRET }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - run: |
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          git add seen.json backfill.txt
          git diff --cached --quiet || (git commit -m "seen orders" && git push)
